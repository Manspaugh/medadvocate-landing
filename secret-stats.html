<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MedAdvocate — Stats</title>
    <style>
      :root {
        --bg: #f4efe5;
        --ink: #1b2c3d;
        --ink-soft: #4a5968;
        --navy: #153b62;
        --yellow: #ffde39;
        --rule: rgba(27, 44, 61, 0.14);
        --white: #fff;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.5;
        padding: clamp(20px, 5vw, 56px);
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--ink-soft);
        font-size: 14px;
        margin: 0 0 28px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      @media (max-width: 560px) {
        .cards {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--white);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 18px 20px;
      }
      .card .label {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin: 0 0 6px;
      }
      .card .num {
        font-size: 34px;
        font-weight: 700;
        line-height: 1;
      }
      .card .meta {
        font-size: 13px;
        color: var(--ink-soft);
        margin-top: 6px;
      }
      .card.accent {
        background: var(--navy);
        color: var(--white);
        border-color: var(--navy);
      }
      .card.accent .label,
      .card.accent .meta {
        color: rgba(255, 255, 255, 0.75);
      }
      section {
        margin-top: 34px;
      }
      h2 {
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-soft);
        margin: 0 0 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        background: var(--white);
        border: 1px solid var(--rule);
        border-radius: 14px;
        overflow: hidden;
      }
      th,
      td {
        text-align: right;
        padding: 9px 14px;
        border-bottom: 1px solid var(--rule);
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      th {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-soft);
        font-weight: 600;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .bar {
        position: relative;
      }
      .bar > span {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: rgba(21, 59, 98, 0.1);
        z-index: 0;
      }
      .bar > b {
        position: relative;
        z-index: 1;
        font-weight: 400;
      }
      .state {
        color: var(--ink-soft);
        padding: 40px 0;
        text-align: center;
      }
      .foot {
        color: var(--ink-soft);
        font-size: 12px;
        margin-top: 22px;
      }
      button.refresh {
        font: inherit;
        font-size: 13px;
        border: 1px solid var(--rule);
        background: var(--white);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>MedAdvocate — Traffic &amp; downloads</h1>
      <p class="sub">
        Visits and store button taps. Cookieless, UTC days.
        <button class="refresh" onclick="load()">Refresh</button>
      </p>

      <form id="gate" style="display: none; margin: 8px 0 0; max-width: 320px">
        <label
          for="pass"
          style="
            display: block;
            font-size: 13px;
            color: var(--ink-soft);
            margin-bottom: 6px;
          "
          >Passphrase</label
        >
        <input
          id="pass"
          type="password"
          autocomplete="off"
          autofocus
          style="
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--rule);
            border-radius: 8px;
            font: inherit;
          "
        />
        <p
          id="gate-err"
          style="
            color: #b3261e;
            font-size: 13px;
            min-height: 18px;
            margin: 8px 0 0;
          "
        ></p>
        <button
          type="submit"
          style="
            font: inherit;
            font-weight: 600;
            background: var(--navy);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
          "
        >
          View stats
        </button>
      </form>

      <div id="content"></div>

      <p class="foot">
        Counts exclude common bots. “CTR” = store taps ÷ visits. Numbers are
        cumulative since tracking went live.
      </p>
    </div>

    <script>
      // Analytics API (API Gateway HTTP API in front of the landing-analytics Lambda).
      var ENDPOINT = "https://82bptss0rj.execute-api.us-east-2.amazonaws.com/";
      var n = function (x) {
        return (x || 0).toLocaleString();
      };
      var pct = function (a, b) {
        return b > 0 ? ((a / b) * 100).toFixed(1) + "%" : "—";
      };

      var gate = document.getElementById("gate");
      var content = document.getElementById("content");

      // The passphrase is never stored in this page; it's typed by you and kept
      // only in sessionStorage (cleared when the tab closes). The Lambda rejects
      // any request without it, so the counts can't be read without it.
      function key() {
        return sessionStorage.getItem("stats_key") || "";
      }
      // HTTP headers can't hold non-Latin1 chars, so base64-encode the UTF-8
      // passphrase; the Lambda base64-decodes before comparing.
      function keyHeader() {
        return btoa(unescape(encodeURIComponent(key())));
      }

      function showGate(msg) {
        content.innerHTML = "";
        gate.style.display = "block";
        document.getElementById("gate-err").textContent = msg || "";
        document.getElementById("pass").focus();
      }

      gate.addEventListener("submit", function (e) {
        e.preventDefault();
        var v = document.getElementById("pass").value;
        if (!v) return;
        sessionStorage.setItem("stats_key", v);
        gate.style.display = "none";
        load();
      });

      function load() {
        content.innerHTML = '<p class="state">Loading…</p>';
        fetch(ENDPOINT + "?days=30", {
          cache: "no-store",
          headers: { "X-Stats-Key": keyHeader() },
        })
          .then(function (r) {
            if (r.status === 401) {
              sessionStorage.removeItem("stats_key");
              showGate("Incorrect passphrase.");
              throw new Error("401");
            }
            if (!r.ok) throw new Error(r.status);
            return r.json();
          })
          .then(render)
          .catch(function (e) {
            if (e.message !== "401")
              content.innerHTML =
                '<p class="state">Could not load stats (' +
                e.message +
                ").</p>";
          });
      }

      function render(d) {
        var t = d.total || {};
        var visits = t.pageview || 0;
        var apple = t.click_app_store || 0;
        var google = t.click_google_play || 0;

        var cards =
          '<div class="cards">' +
          '<div class="card accent"><p class="label">Visits</p><div class="num">' +
          n(visits) +
          '</div><p class="meta">all time</p></div>' +
          '<div class="card"><p class="label">App Store taps</p><div class="num">' +
          n(apple) +
          '</div><p class="meta">' +
          pct(apple, visits) +
          " CTR</p></div>" +
          '<div class="card"><p class="label">Google Play taps</p><div class="num">' +
          n(google) +
          '</div><p class="meta">' +
          pct(google, visits) +
          " CTR</p></div>" +
          "</div>";

        var rows = (d.daily || []).filter(function (r) {
          return r.pageview || r.click_app_store || r.click_google_play;
        });
        var max = rows.reduce(function (m, r) {
          return Math.max(m, r.pageview || 0);
        }, 1);
        var table =
          "<section><h2>Last 30 days</h2><table><thead><tr>" +
          "<th>Date</th><th>Visits</th><th>Apple</th><th>Google</th></tr></thead><tbody>" +
          (rows.length
            ? rows
                .map(function (r) {
                  var w = ((r.pageview || 0) / max) * 100;
                  return (
                    "<tr><td>" +
                    r.date +
                    "</td>" +
                    '<td class="bar"><span style="width:' +
                    w +
                    '%"></span><b>' +
                    n(r.pageview) +
                    "</b></td>" +
                    "<td>" +
                    n(r.click_app_store) +
                    "</td>" +
                    "<td>" +
                    n(r.click_google_play) +
                    "</td></tr>"
                  );
                })
                .join("")
            : '<tr><td colspan="4" style="text-align:center;color:var(--ink-soft)">No activity yet</td></tr>') +
          "</tbody></table></section>";

        content.innerHTML = cards + table;
      }

      // Resume if a passphrase is already held for this tab, else prompt.
      if (key()) load();
      else showGate();
    </script>
  </body>
</html>
