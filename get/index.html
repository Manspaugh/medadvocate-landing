<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Share link, not a landing page: keep it out of the index. Deliberately
         NOT disallowed in robots.txt — a crawler has to fetch the page to see
         this tag. Also intentionally absent from sitemap.xml. -->
    <meta name="robots" content="noindex,nofollow" />
    <title>Get MedAdvocate</title>
    <meta name="theme-color" content="#153B62" />

    <!-- Open Graph — this URL exists to be shared, so it should preview well. -->
    <meta property="og:title" content="Get MedAdvocate" />
    <meta
      property="og:description"
      content="Snap a photo of your medical bill. We find the errors, write, and send a dispute letter on your behalf."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.medadvocate.net/get" />
    <meta
      property="og:image"
      content="https://www.medadvocate.net/assets/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="MedAdvocate — Your medical bill is probably wrong."
    />
    <meta property="og:site_name" content="MedAdvocate" />

    <!-- ─────────────────────────────────────────────────────────────────────
         Platform redirect. Deliberately the FIRST script and placed above the
         font <link> and <style> so it runs during head parsing, before the
         browser blocks on any external resource — the body below never paints
         for a visitor with JS.

         GitHub Pages serves static files only (no redirect rules, no edge
         functions), so this cannot be a real 302. The markup below is the
         visible fallback for the script-blocked case.

         Analytics (cookieless, existing landing-analytics Lambda) is split by
         path so a visit is counted exactly once:
           • mobile — beacon a pageview carrying the share UTMs, plus the same
             store-click counter the rest of the site fires, then hand off.
           • desktop — beacon nothing; pass the UTMs through on the homepage URL
             and let the homepage's own tracker record the pageview. Beaconing
             here as well would count the same visitor twice.
         sendBeacon is queued by the browser and survives navigation, so the
         redirect fires in the same tick — nothing is delayed waiting on it.
         ───────────────────────────────────────────────────────────────────── -->
    <script>
      (function () {
        var ANALYTICS =
          "https://82bptss0rj.execute-api.us-east-2.amazonaws.com/";
        var UTM = "utm_source=share&utm_medium=app";
        var APP_STORE =
          "https://apps.apple.com/us/app/medadvocate/id6783083802?" + UTM;
        var PLAY =
          "https://play.google.com/store/apps/details?id=com.medadvocate.app&" +
          UTM;

        var ua = navigator.userAgent || "";
        // iPadOS 13+ reports a Macintosh UA, so a touch-capable "Mac" is an
        // iPad. Real Macs report maxTouchPoints 0 and fall through to the
        // homepage.
        var isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isAndroid = /android/i.test(ua);

        if (!isIOS && !isAndroid) {
          location.replace("/?" + UTM);
          return;
        }

        function track(ev, extra) {
          try {
            var p = { event: ev };
            if (extra) for (var k in extra) p[k] = extra[k];
            navigator.sendBeacon(ANALYTICS, JSON.stringify(p));
          } catch (e) {}
        }

        // Referrer hostname only (no path or query), dropping self referrals —
        // matches how index.html attributes a visit.
        var ref = "";
        try {
          if (document.referrer) {
            var rh = new URL(document.referrer).hostname.toLowerCase();
            if (rh && rh !== location.hostname) ref = rh;
          }
        } catch (e) {}

        track("pageview", {
          ref: ref,
          utm_source: "share",
          utm_medium: "app",
        });
        track(isIOS ? "click_app_store" : "click_google_play");

        // replace() so /get leaves no history entry: back from the store
        // returns where the visitor came from instead of re-triggering this.
        location.replace(isIOS ? APP_STORE : PLAY);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
    />

    <style>
      :root {
        --bg: #f4efe5;
        --ink: #1b2c3d;
        --ink-soft: #4a5968;
        --navy: #153b62;
        --rule: rgba(27, 44, 61, 0.14);
        --white: #ffffff;

        --font-sans: "Source Sans 3", -apple-system, BlinkMacSystemFont,
          "Segoe UI", system-ui, sans-serif;
        --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;

        --gutter: clamp(20px, 5vw, 80px);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px var(--gutter);
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 460px;
        text-align: center;
      }
      .logo {
        width: 190px;
        height: auto;
        margin-bottom: 32px;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(26px, 6vw, 32px);
        font-weight: 600;
        line-height: 1.2;
        margin: 0 0 10px;
      }
      .lede {
        color: var(--ink-soft);
        margin: 0 0 28px;
      }

      /* App-store buttons — same treatment as the landing page. */
      .store-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .store-badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 4px 16px 12px;
        min-height: 56px;
        background: #000;
        color: #fff;
        border-radius: 12px;
        border: 1px solid #000;
        text-decoration: none;
        transition: transform 0.15s, box-shadow 0.15s;
        min-width: 180px;
      }
      .store-badge:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      }
      .store-badge:focus-visible {
        outline: 3px solid var(--navy);
        outline-offset: 3px;
      }
      .store-badge svg {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
      }
      .sb-eyebrow {
        font-size: 10px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.04em;
        opacity: 0.9;
        margin-bottom: 2px;
      }
      .sb-label {
        display: block;
        font-family: var(--font-serif);
        font-size: 17px;
        font-weight: 600;
        line-height: 1;
        margin-top: -2px;
      }

      .home {
        margin: 28px 0 0;
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }
      /* Underline via text-decoration, not a border: the border would paint at
         the bottom of the 44px tap target, detached from the text. */
      .home a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--navy);
        font-weight: 600;
        text-decoration: underline;
        text-decoration-color: var(--rule);
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }
      .home a:hover {
        text-decoration-color: var(--navy);
      }
      .home a:focus-visible {
        outline: 3px solid var(--navy);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .store-badge {
          transition: none;
        }
        .store-badge:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Only ever seen when the redirect script above is blocked. Both stores
         stay visible rather than auto-forwarding: a meta refresh could not tell
         which platform the visitor is on, so it would fight the script on
         mobile and strand everyone else on the homepage. -->
    <main class="card">
      <img
        class="logo"
        src="/assets/logo-horizontal-darkblue.svg"
        alt="MedAdvocate"
        width="190"
        height="34"
      />
      <h1>Opening MedAdvocate…</h1>
      <p class="lede">
        If nothing happens, pick your store below.
      </p>

      <div class="store-row">
        <a
          class="store-badge"
          href="https://apps.apple.com/us/app/medadvocate/id6783083802?utm_source=share&amp;utm_medium=app"
          aria-label="Download MedAdvocate on the App Store"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.61-2.2.43-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"
            />
          </svg>
          <span>
            <span class="sb-eyebrow">Download on the</span>
            <span class="sb-label">App Store</span>
          </span>
        </a>
        <a
          class="store-badge"
          href="https://play.google.com/store/apps/details?id=com.medadvocate.app&amp;utm_source=share&amp;utm_medium=app"
          aria-label="Get MedAdvocate on Google Play"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="pi-a" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#00DDFF" />
                <stop offset="1" stop-color="#00BBFF" />
              </linearGradient>
              <linearGradient id="pi-b" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFCE00" />
                <stop offset="1" stop-color="#FF9500" />
              </linearGradient>
              <linearGradient id="pi-c" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#FF3A44" />
                <stop offset="1" stop-color="#C31162" />
              </linearGradient>
              <linearGradient id="pi-d" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#00C752" />
                <stop offset="1" stop-color="#00A047" />
              </linearGradient>
            </defs>
            <path
              d="M3.6 2.4 14 12 3.6 21.6c-.3-.2-.5-.5-.5-.9V3.3c0-.4.2-.7.5-.9z"
              fill="url(#pi-a)"
            />
            <path
              d="M14 12 3.6 21.6c.4.3 1 .3 1.5.1L17.5 14.6 14 12z"
              fill="url(#pi-c)"
            />
            <path
              d="M14 12 3.6 2.4c.4-.3 1-.3 1.5-.1L17.5 9.4 14 12z"
              fill="url(#pi-d)"
            />
            <path
              d="m17.5 9.4 3.4 1.9c.7.4.7 1.4 0 1.8l-3.4 1.5L14 12l3.5-2.6z"
              fill="url(#pi-b)"
            />
          </svg>
          <span>
            <span class="sb-eyebrow">Get it on</span>
            <span class="sb-label">Google Play</span>
          </span>
        </a>
      </div>

      <p class="home">
        <a href="/?utm_source=share&amp;utm_medium=app"
          >Go to medadvocate.net</a
        >
      </p>
    </main>
  </body>
</html>
